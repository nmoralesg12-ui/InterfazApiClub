<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Servicios del Club</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0f172a;
    color: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    width: 400px;
}
.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
h2 {
    margin-bottom: 15px;
}
select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 8px;
    margin-bottom: 15px;
}
button {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background: #1d4ed8;
}
table {
    width: 100%;
    margin-top: 10px;
}
td, th {
    padding: 8px;
    border-bottom: 1px solid #334155;
}
.aprobado { color: #22c55e; }
.rechazado { color: #ef4444; }
</style>

</head>
<body>

<div class="container">

<div class="card">
    <h2>💳 Pago de Servicios</h2>

    <label>Servicio:</label>
    <select id="servicio">
        <option value="1">Gimnasio</option>
        <option value="2">Academia de Futbol</option>
    </select>

    <button onclick="pagar()">Realizar Pago</button>
</div>

<div class="card">
    <button onclick="verHistorial()">Ver Historial</button>
</div>

<div class="card" id="resultado"></div>

</div>

<script src="app.js"></script>

</body>
</html>
